name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**/*.dvc'
      - 'src/**/*.py'
      - 'tests/**/*.py'
      - 'params.yaml'
      - 'requirements.txt'
      - '.dvc/config'
      - '.github/workflows/cicd.yml'
  workflow_dispatch:

permissions:
  contents: read

# Serialize releases so two runs cannot overwrite each other's rollback backup.
concurrency:
  group: income-production
  cancel-in-progress: false

env:
  CLOUD_PROVIDER: ${{ vars.CLOUD_PROVIDER || 'gcp' }}
  AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}

jobs:
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -v

  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Authenticate to Cloud Storage
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: python -m src.authenticate
      - name: Pull versioned training and holdout data
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc
      - name: Check class distribution before training
        run: python -c "from src.train import read_data,check_drift; check_drift(read_data('data/train_batch1.csv'))"
      - name: Train and track (DagsHub when configured)
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: python src/train.py
      - name: Precision, recall and confusion matrix
        run: cat outputs/detail.txt
      - name: Read report
        id: read_report
        run: |
          python - <<'PY'
          import json, os
          report = json.load(open('outputs/report.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"f1={report['f1_score']}\n")
          PY
      - name: Save candidate model and evaluation
        uses: actions/upload-artifact@v4
        with:
          name: candidate
          path: |
            models/model.joblib
            outputs/report.json
            outputs/detail.txt
          if-no-files-found: error

  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check positive-class F1
        env:
          NEW_F1: ${{ needs.train.outputs.f1 }}
        run: |
          python - <<'PY'
          import os
          from src.release import should_release
          should_release({'f1_score': float(os.environ['NEW_F1'])})
          PY

  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    env:
      ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: candidate
      - name: Authenticate to Cloud Storage
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: python -m src.authenticate
      - name: Compare F1 and promote only a non-regressing model
        id: promote
        run: python -m src.release promote
      - name: Allow SSH from this runner only
        id: ssh_access
        if: steps.promote.outputs.deploy == 'true' && env.CLOUD_PROVIDER == 'aws'
        env:
          SERVER_SECURITY_GROUP: ${{ vars.SERVER_SECURITY_GROUP }}
        run: python -m src.runner_ssh allow
      - name: Deploy API code and restart VM
        id: deploy
        if: steps.promote.outputs.deploy == 'true'
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST_KEY: ${{ secrets.SERVER_HOST_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/income_deploy
          chmod 600 ~/.ssh/income_deploy
          printf '%s\n' "$SERVER_HOST_KEY" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/income_deploy "$SERVER_USER@$SERVER_HOST" 'mkdir -p ~/income-api/src ~/income-api/scripts'
          scp -i ~/.ssh/income_deploy src/serve.py src/cloud.py src/__init__.py "$SERVER_USER@$SERVER_HOST:income-api/src/"
          scp -i ~/.ssh/income_deploy requirements.txt "$SERVER_USER@$SERVER_HOST:income-api/"
          scp -i ~/.ssh/income_deploy scripts/setup_vm.sh "$SERVER_USER@$SERVER_HOST:income-api/scripts/"
          ssh -i ~/.ssh/income_deploy "$SERVER_USER@$SERVER_HOST" "if ! systemctl cat income-api >/dev/null 2>&1; then ARTIFACT_BUCKET='$ARTIFACT_BUCKET' CLOUD_PROVIDER='$CLOUD_PROVIDER' AWS_DEFAULT_REGION='$AWS_DEFAULT_REGION' bash ~/income-api/scripts/setup_vm.sh; fi"
          ssh -i ~/.ssh/income_deploy "$SERVER_USER@$SERVER_HOST" 'sudo systemctl restart income-api; for i in $(seq 1 20); do if curl -fsS http://localhost:8080/healthz; then exit 0; fi; sleep 2; done; exit 1'
      - name: Restore cloud artifacts if deployment fails
        if: failure() && steps.promote.outputs.deploy == 'true'
        run: python -m src.release rollback
      - name: Restart previous model after rollback
        if: failure() && steps.promote.outputs.deploy == 'true'
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: ssh -i ~/.ssh/income_deploy "$SERVER_USER@$SERVER_HOST" 'sudo systemctl restart income-api'
      - name: Remove temporary runner SSH access
        if: always() && steps.ssh_access.outputs.rule_id != ''
        env:
          SERVER_SECURITY_GROUP: ${{ vars.SERVER_SECURITY_GROUP }}
          SSH_RULE_ID: ${{ steps.ssh_access.outputs.rule_id }}
        run: python -m src.runner_ssh revoke
